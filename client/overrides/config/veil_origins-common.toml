["General Settings"]
	#Enable or disable origin-based player size scaling.
	#When disabled, all players will be normal sized regardless of origin.
	enableSizeScaling = true
	#Enable origin weaknesses (extra damage from certain sources).
	#Disable if you want origins to only have benefits.
	enableWeaknesses = true
	#Enable origin resistances (reduced damage from certain sources).
	enableResistances = true
	#Show particle effects for origin abilities.
	showOriginParticles = true
	#Play sound effects for origin abilities.
	enableOriginSounds = true

["Radial Menu"]
	#When enabled, the origin selection radial menu will automatically open
	#the first time a player joins a world without an origin.
	openOriginSelectOnFirstJoin = true
	#When enabled, players can change their origin via the radial menu.
	#When disabled, players can only select an origin once.
	allowOriginChange = false
	#Show ability cooldowns in the radial menu.
	radialMenuShowCooldowns = true

["Origin Sizes"]
	#Size multipliers for each origin.
	#1.0 = normal size, 0.5 = half size, 2.0 = double size
	#Recommended range: 0.5 to 1.5 for balanced gameplay
	#Veilborn - Masters of the boundary between life and death
	# Default: 0.95
	# Range: 0.5 ~ 2.0
	veilbornSize = 0.95
	#Stoneheart - Living stone, immovable and heavy
	# Default: 1.2
	# Range: 0.5 ~ 2.0
	stoneheartSize = 1.2
	#Feralkin - Beast shapeshifters with animal instincts
	# Default: 0.95
	# Range: 0.5 ~ 2.0
	feralkinSize = 0.95
	#Riftwalker - Dimensional travelers who bend space
	# Default: 1.0
	# Range: 0.5 ~ 2.0
	riftwalkerSize = 1.0
	#Umbrakin - Shadow manipulators, creatures of darkness
	# Default: 0.9
	# Range: 0.5 ~ 2.0
	umbrakinSize = 0.9
	#Voidtouched - Corrupted by the void, reality benders
	# Default: 1.05
	# Range: 0.5 ~ 2.0
	voidtouchedSize = 1.05
	#Frostborn - Children of winter, masters of ice
	# Default: 1.0
	# Range: 0.5 ~ 2.0
	frostbornSize = 1.0
	#Cindersoul - Born from volcanic fury
	# Default: 1.0
	# Range: 0.5 ~ 2.0
	cindersoulSize = 1.0
	#Tidecaller - Ocean dwellers who command water
	# Default: 0.95
	# Range: 0.5 ~ 2.0
	tidecallerSize = 0.95
	#Starborne - Fallen from the cosmos, light beings
	# Default: 0.85
	# Range: 0.5 ~ 2.0
	starborneSize = 0.85
	#Skyborn - Wind masters who never touch the ground
	# Default: 0.9
	# Range: 0.5 ~ 2.0
	skybornSize = 0.9
	#Mycomorph - Part mushroom, part humanoid
	# Default: 0.9
	# Range: 0.5 ~ 2.0
	mycomorphSize = 0.9
	#Crystalline - Living crystal with resonant powers
	# Default: 1.1
	# Range: 0.5 ~ 2.0
	crystallineSize = 1.1
	#Technomancer - Cybernetic being, part flesh part machine
	# Default: 1.0
	# Range: 0.5 ~ 2.0
	technomancerSize = 1.0
	#Ethereal - Ghostly being phased between dimensions
	# Default: 0.85
	# Range: 0.5 ~ 2.0
	etherealSize = 0.85

